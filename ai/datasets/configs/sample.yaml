# Small representative sample — this is what Sprint AI-2 actually runs and
# ships in the repo. 5 images per class x 6 classes = 30 images total, kept
# deliberately small per this sprint's explicit "do not generate thousands
# of images" instruction.
image_size: [320, 320]
images_per_class:
  SAFE: 5
  TORN: 5
  OPENED: 5
  CRUSHED: 5
  TAPED: 5
  PARTIAL_DAMAGE: 5
output_dir: datasets/synthetic
seed: 42
apply_augmentation: true
augmentation:
  rotation_degrees: 15.0
  brightness_range: [0.7, 1.3]
  contrast_range: [0.7, 1.3]
  color_jitter_range: [0.8, 1.2]
  gaussian_noise_std: 8.0
  blur_probability: 0.4
  motion_blur_probability: 0.2
  jpeg_quality_range: [40, 85]
  variants_per_image: 3
generator_version: v1.0.0
