# EXAMPLE ONLY — not run by this sprint. Shows how to scale generation up
# to the dataset sizes recommended in docs/chainguard-ai-technical-design-
# phase3a.md, Step 5 (300-500 train / 60-100 val / 60-100 test per class).
# Copy this file, adjust counts, and run:
#   python -m datasets.generator.cli --config datasets/configs/your_config.yaml
# See datasets/README.md, "Generating datasets of any size", for the full
# walkthrough including how output_dir relates to the train/val/test split
# step (a separate, later tool — not part of this sprint).
image_size: [640, 640]     # full YOLOv8 training resolution, vs. sample.yaml's 320x320
images_per_class:
  SAFE: 500
  TORN: 500
  OPENED: 500
  CRUSHED: 500
  TAPED: 500
  PARTIAL_DAMAGE: 500
output_dir: datasets/synthetic
seed: null                  # null = non-deterministic, a fresh random set each run
apply_augmentation: true
augmentation:
  rotation_degrees: 15.0
  brightness_range: [0.7, 1.3]
  contrast_range: [0.7, 1.3]
  color_jitter_range: [0.8, 1.2]
  gaussian_noise_std: 8.0
  blur_probability: 0.4
  motion_blur_probability: 0.2
  jpeg_quality_range: [40, 85]
  variants_per_image: 3
generator_version: v1.0.0
